[tool.poetry]
name = "lab1_Suhangulyyev_M"
version = "0.1.6"
description = "CRUD API for a news portal (Fastapi)."
authors = ["Muhammet Suhangulyyev <muhammet.jkl2.suhanguylev@gmail.com>"]
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.37.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.40"}
asyncpg = "^0.30.0"
alembic = "^1.16.0"
pydantic = {extras = ["email"], version = "^2.10.0"}
pydantic-settings = "^2.10.0"
psycopg2-binary = "^2.9.9"
fastapi-sso = "^0.18.0"
argon2-cffi = "^25.1.0"
pyjwt = "^2.10.1"
python-multipart = "^0.0.20"
redis = {extras = ["hiredis"], version = "^5.0.0"}
celery = {extras = ["redis"], version = "~5.4.0"}
prometheus-fastapi-instrumentator = "^7.1.0"
structlog = "^25.5.0"
hawk-python-sdk = {extras = ["fastapi"], version = "^3.5.2"}

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
httpx = "^0.28.1"
pytest-asyncio = "^1.3.0"
pytest-mock = "^3.15.1"
fakeredis = "^2.32.0"
pytest-playwright = "^0.7.2"
nest_asyncio = "^1.6.0"
