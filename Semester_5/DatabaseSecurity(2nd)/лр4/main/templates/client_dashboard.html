<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель клиента</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Панель клиента</h1>
        <button id="load-data">Загрузить доступные самокаты</button>
        <div id="result"></div>
    </div>
    <script>
        const loadButton = document.getElementById('load-data');
        const resultDiv = document.getElementById('result');
        const token = localStorage.getItem('jwt_token');

        if (!token) {
            window.location.href = '/ui/login';
        }

        loadButton.addEventListener('click', async () => {
            resultDiv.innerHTML = '<p>Загрузка...</p>';
            try {
                const response = await fetch('/api/client/scooters', {
                    method: 'GET',
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (response.status === 401) {
                     window.location.href = '/ui/login';
                     return;
                }
                
                const data = await response.json();

                if (response.ok) {
                    let table = '<table><tr><th>ID</th><th>Местоположение</th><th>Тариф</th><th>Уровень заряда (%)</th></tr>';
                    data.forEach(scooter => {
                        table += `<tr>
                            <td>${scooter.scooterid}</td>
                            <td>${scooter['Местоположение']}</td>
                            <td>${scooter['Тариф']}</td>
                            <td>${scooter['Уровень заряда']}</td>
                        </tr>`;
                    });
                    table += '</table>';
                    resultDiv.innerHTML = table;
                } else {
                    resultDiv.innerHTML = `<p style="color:red;">Ошибка: ${data.message}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<p style="color:red;">Сетевая ошибка.</p>`;
            }
        });
    </script>
</body>
</html>
