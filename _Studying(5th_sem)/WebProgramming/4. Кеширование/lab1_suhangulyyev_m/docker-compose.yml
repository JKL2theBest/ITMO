services:
  db:
    image: postgres:17
    container_name: postgres_news_db
    environment:
      POSTGRES_USER: news_muhammet
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_db
    ports:
      - "5432:5432" # Можно поменять
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:8-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
